<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>LongShot 测试页 · 长页面 / 懒加载 / 吸顶栏 / 内层滚动</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1c2333; background: #fff;
  }
  .nav {
    position: sticky; top: 0; z-index: 50;
    height: 64px; display: flex; align-items: center; gap: 18px;
    padding: 0 24px; background: #0b0f18; color: #fff;
  }
  .nav b { font-size: 15px; letter-spacing: .5px; }
  .nav span { opacity: .6; font-size: 13px; }
  .nav .right { margin-left: auto; font-size: 12px; opacity: .7; }

  .hero { padding: 46px 40px 34px; background: linear-gradient(160deg, #eef4ff, #f8fbff); }
  .hero h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.3px; }
  .hero p { margin: 0; color: #55627a; }

  section {
    position: relative; height: 400px; padding: 34px 40px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  section .idx { font: 700 64px/1 ui-monospace, Menlo, Consolas, monospace; opacity: .28; }
  section .card {
    background: rgba(255, 255, 255, .92); border-radius: 14px; padding: 20px 24px;
    box-shadow: 0 10px 28px rgba(24, 40, 70, .10); max-width: 560px;
  }
  section h2 { margin: 0 0 6px; font-size: 19px; }
  section p { margin: 0; color: #4a566d; font-size: 13.5px; }

  .thumb { width: 120px; height: 76px; border-radius: 10px; background: #e9eef8; display: block; }

  .chat {
    position: fixed; right: 22px; bottom: 22px; z-index: 80;
    width: 54px; height: 54px; border-radius: 50%;
    background: #ff5c5c; color: #fff; display: grid; place-items: center;
    font-size: 12px; box-shadow: 0 10px 26px rgba(255, 92, 92, .45);
  }

  .panel { padding: 40px; background: #f5f7fb; }
  .panel h2 { margin: 0 0 12px; font-size: 19px; }
  .scroller {
    height: 300px; width: 620px; padding: 8px 0 8px 12px; overflow-y: auto; border-radius: 12px;
    background: #fff; border: 1px solid #dfe6f2;
  }
  .scroller div { height: 100px; display: flex; align-items: center; padding-left: 20px; font-size: 13px; }

  footer { padding: 40px; text-align: center; color: #6b7791; font-size: 13px; background: #eceff6; }
</style>
</head>
<body>
  <div class="nav"><b>PAGE</b><span>LongShot 测试页</span><span class="right">吸顶导航栏</span></div>

  <div class="hero">
    <h1>整页长截图验证页面</h1>
    <p>本页含：吸顶导航栏、固定悬浮按钮、懒加载图片、内层滚动容器。用于校验逐帧拼接是否错位。</p>
  </div>

  <div id="sections"></div>

  <div class="panel">
    <h2>内层滚动容器（元素长截图测试）</h2>
    <div class="scroller" id="scroller"></div>
  </div>

  <footer>—— 页面结束 ——</footer>

  <div class="chat">客服</div>

<script>
  const PALETTE = [
    '#ffe8e8', '#ffeede', '#fff6d9', '#f3f8d8', '#e4f6e0', '#daf3ea',
    '#d9f2f6', '#ddebfb', '#e4e2fb', '#eee0f8', '#f9e2f2', '#fbe2e6',
    '#f6e3d8', '#f0ecd9', '#e6f0d9', '#d9f0e3', '#d9eef3', '#dde7fa',
    '#e6e2fa', '#f0e0f7', '#fae2f0', '#fae3e3', '#f4e6dc', '#e8eaf2'
  ];
  const TITLES = ['页面概览', '数据看板', '功能列表', '流程说明', '常见问题', '版本记录'];

  window.__sections = [];
  const wrap = document.getElementById('sections');
  const frag = document.createDocumentFragment();

  PALETTE.forEach((color, i) => {
    const s = document.createElement('section');
    s.style.background = color;
    s.innerHTML = `
      <div>
        <div class="card">
          <h2>${TITLES[i % TITLES.length]} · 第 ${i + 1} 屏</h2>
          <p>这一屏用于验证纵向拼接的连续性：如果出现错位、重复或缺失，采样得到的色带顺序就会与预期不符。</p>
        </div>
      </div>
      <div class="idx">${String(i + 1).padStart(2, '0')}</div>
    `;
    if (i % 3 === 0) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.loading = 'lazy';
      img.alt = 'lazy ' + i;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="76">
           <rect width="120" height="76" rx="10" fill="#4a7bff"/>
           <text x="60" y="46" font-size="26" fill="#fff" text-anchor="middle" font-family="monospace">${i + 1}</text>
         </svg>`);
      s.appendChild(img);
    }
    frag.appendChild(s);
    const top = s.offsetTop;
    window.__sections.push({ i, color, top, height: 400 });
  });
  wrap.appendChild(frag);

  // offsetTop 需要布局完成后才准确
  requestAnimationFrame(() => {
    const nodes = wrap.querySelectorAll('section');
    window.__sections = Array.from(nodes).map((n, i) => ({
      i,
      color: PALETTE[i],
      top: Math.round(n.getBoundingClientRect().top + window.scrollY),
      height: Math.round(n.getBoundingClientRect().height)
    }));
  });

  const sc = document.getElementById('scroller');
  for (let i = 0; i < 30; i += 1) {
    const row = document.createElement('div');
    row.style.background = i % 2 ? '#f7f9ff' : '#fff';
    row.textContent = `滚动容器第 ${i + 1} 行`;
    sc.appendChild(row);
  }
</script>
</body>
</html>
